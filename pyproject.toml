[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pylogcage"
version = "1.0.0"
description = "Zero-dependency CWE-117 log sanitization, terminal escape stripping, secret redaction, and safe logging formatters"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "draarivpatel-ui contributors" }]
keywords = [
    "logging",
    "security",
    "cwe-117",
    "log-injection",
    "ansi",
    "redaction",
    "secrets",
    "pii",
    "ndjson",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
pylogcage = "pylogcage.cli:main"

[project.urls]
Homepage = "https://github.com/draarivpatel-ui/pylogcage"
Repository = "https://github.com/draarivpatel-ui/pylogcage"
Issues = "https://github.com/draarivpatel-ui/pylogcage/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pylogcage*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pylogcage = ["py.typed"]
